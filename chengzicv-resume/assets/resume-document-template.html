<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{NAME}} · {{TARGET_JOB}}</title>
<style>
:root{--bg-primary:#ffffff;--bg-secondary:#f7f6f2;--bg-tertiary:#faf9f5;--text-primary:#2c2c2a;--text-secondary:#5f5e5a;--text-tertiary:#888780;--border-tertiary:rgba(44,44,42,.15);--border-secondary:rgba(44,44,42,.28);--coral-50:#FAECE7;--coral-200:#F0997B;--coral-600:#993C1D;--coral-800:#712B13;--font-sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}
@page{size:A4;margin:16mm}
body{margin:0;background:var(--bg-tertiary);color:var(--text-primary);font-family:var(--font-sans);font-size:14px;line-height:1.75;-webkit-font-smoothing:antialiased}
.page{max-width:794px;margin:0 auto;padding:40px 44px 48px;background:var(--bg-primary);border-left:.5px solid var(--border-tertiary);border-right:.5px solid var(--border-tertiary)}
h1{margin:0;font-size:26px;font-weight:500;line-height:1.35;letter-spacing:-.01em}
.contact{margin:10px 0 0;font-size:13px;color:var(--text-secondary);line-height:1.8}
.intent{margin:6px 0 0;font-size:14px;font-weight:500}
.rule{height:.5px;background:var(--border-secondary);margin:20px 0}
h2{margin:30px 0 12px;font-size:16px;font-weight:500}
h2 .idx{font-size:12px;color:var(--coral-600);font-weight:500;margin-right:8px;letter-spacing:.04em}
p{margin:0 0 10px}
.adv{display:grid;grid-template-columns:110px 1fr;gap:14px;padding:10px 0;border-bottom:.5px solid var(--border-tertiary)}
.adv:last-child{border-bottom:0}
.adv .k{font-size:13px;font-weight:500;color:var(--coral-800)}
.adv .v{font-size:14px}
.job{margin-bottom:20px}
.job .head{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
.job .time{font-size:13px;color:var(--text-tertiary)}
.job .who{font-size:15px;font-weight:500}
.job .role{font-size:13px;color:var(--text-secondary)}
.job .bg{font-size:14px;margin:0 0 8px}
.job .bg b{font-weight:500;color:var(--coral-800)}
ul{margin:0 0 10px;padding-left:22px}
li{margin-bottom:6px}
li:last-child{margin-bottom:0}
.result{font-size:14px;margin:8px 0 0}
.note{font-size:12px;color:var(--text-tertiary);line-height:1.8}
footer{margin-top:36px;padding-top:16px;border-top:.5px solid var(--border-tertiary)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media print{body{background:#fff;-webkit-print-color-adjust:exact}.page{max-width:none;border:0;padding:0}.job{break-inside:avoid;page-break-inside:avoid}}
@media (max-width:760px){.page{max-width:none;padding:28px 22px;border:0}h1{font-size:22px}.adv{grid-template-columns:1fr;gap:4px}}
</style>
</head>
<body>
<h2 class="sr-only">{{NAME}}的简历。</h2>
<main class="page">
  <header>
    <h1>{{NAME}}</h1>
    <p class="contact">{{CONTACT}}</p>
    <p class="intent">求职意向：{{TARGET_JOB}}</p>
  </header>
  <div class="rule"></div>
  <h2><span class="idx">01</span>个人优势</h2>
  {{ADVANTAGE_ITEMS}}
  <!-- ADVANTAGE_ITEMS 每层：<div class="adv"><div class="k">背景层|能力层|产出层|荣誉层</div><div class="v">内容</div></div> -->
  <h2><span class="idx">02</span>经历</h2>
  {{EXPERIENCE_BLOCKS}}
  <!-- EXPERIENCE_BLOCKS 每段：
  <div class="job">
    <div class="head"><span class="time">起止时间</span><span class="who">公司或项目名</span><span class="role">真实角色</span></div>
    <p class="bg"><b>背景：</b>一句场景、痛点或规模</p>
    <ul><li>动作 bullets，单层</li></ul>
    <p class="result">有依据的成果句（无则整行删除）</p>
  </div> -->
  <h2><span class="idx">03</span>技能与证书</h2>
  {{SKILL_BLOCK}}
  <!-- SKILL_BLOCK：一段 <p>，或 <ul><li> 逐条列技能与证书；没有就整节（含 03 标题）删除 -->
  <h2><span class="idx">04</span>教育背景</h2>
  {{EDUCATION_BLOCK}}
  <!-- EDUCATION_BLOCK：一段 <p>（学校 · 专业 · 学历 · 起止时间），有排名或核心课程再加 <ul>；没有就整节删除 -->
  <footer>
    <p class="note">本页生成于 {{GENERATED_AT}}，内容以已确认事实为准。</p>
  </footer>
</main>
</body>
</html>
