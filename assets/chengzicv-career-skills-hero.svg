<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="460" viewBox="0 0 1400 460" role="img" aria-labelledby="title description">
  <title id="title">ChengziCV Career Skills</title>
  <desc id="description">橙子简历开源求职 Skills：不只改简历，陪你把找工作这件事做对。</desc>
  <style>
    :root {
      --paper: #FCFBF9;
      --surface: #FFFFFF;
      --ink: #1A1917;
      --muted: #716C65;
      --line: #E6DFD7;
      --orange: #F45F2B;
      --orange-deep: #D64200;
      --orange-soft: #FFE3D2;
      --leaf: #06758F;
    }

    .mark,
    .leaf,
    .eyebrow,
    .wordmark,
    .subtitle,
    .meta,
    .rule {
      animation-fill-mode: both;
    }

    .mark {
      animation: mark-in 900ms cubic-bezier(0.23, 1, 0.32, 1) 80ms;
      transform-box: fill-box;
      transform-origin: center;
    }

    .leaf {
      animation: leaf-in 800ms cubic-bezier(0.23, 1, 0.32, 1) 260ms;
      transform-box: fill-box;
      transform-origin: 20% 90%;
    }

    .eyebrow { animation: copy-in 650ms cubic-bezier(0.23, 1, 0.32, 1) 180ms; }
    .wordmark { animation: copy-in 760ms cubic-bezier(0.23, 1, 0.32, 1) 290ms; }
    .subtitle { animation: copy-in 700ms cubic-bezier(0.23, 1, 0.32, 1) 430ms; }
    .meta { animation: copy-in 650ms cubic-bezier(0.23, 1, 0.32, 1) 570ms; }

    .rule {
      animation: rule-in 760ms cubic-bezier(0.23, 1, 0.32, 1) 620ms;
      stroke-dasharray: 460;
      stroke-dashoffset: 460;
    }

    @keyframes mark-in {
      from { opacity: 0; transform: translateY(20px) scale(0.95) rotate(-3deg); }
      to { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
    }

    @keyframes leaf-in {
      from { opacity: 0; transform: translateY(-26px) rotate(-16deg); }
      to { opacity: 1; transform: translateY(0) rotate(0); }
    }

    @keyframes copy-in {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes rule-in {
      from { opacity: 0; stroke-dashoffset: 460; }
      to { opacity: 1; stroke-dashoffset: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .mark,
      .leaf,
      .eyebrow,
      .wordmark,
      .subtitle,
      .meta,
      .rule {
        animation: none;
        opacity: 1;
        transform: none;
        stroke-dashoffset: 0;
      }
    }
  </style>

  <rect width="1400" height="460" fill="var(--paper)"/>
  <path d="M0 0H1400V12H0Z" fill="var(--orange)"/>
  <path d="M72 388H1328" stroke="var(--line)" stroke-width="2"/>
  <circle cx="1294" cy="64" r="7" fill="var(--orange)"/>
  <circle cx="1320" cy="64" r="7" fill="var(--leaf)"/>

  <g transform="translate(118 111)">
    <g class="mark">
    <path
      d="M102 17C67 17 36 43 29 79C22 116 42 148 75 154C99 158 120 147 125 129C130 111 116 100 104 88C91 75 91 57 101 43C108 33 118 26 129 22C120 19 111 17 102 17Z"
      fill="var(--orange)"
    />
    <path
      d="M131 42C115 48 106 61 108 75C110 88 123 98 131 110C142 126 137 143 124 155C112 166 94 172 76 171C92 182 111 188 131 187C172 185 202 153 201 112C200 75 173 45 139 41C136 41 133 41 131 42Z"
      fill="var(--orange)"
    />
    <path
      class="leaf"
      d="M126 15C137 0 161 -4 181 4C174 25 151 35 127 28C124 24 124 19 126 15Z"
      fill="var(--leaf)"
    />
    </g>
  </g>

  <g font-family="Inter, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif">
    <g class="eyebrow">
      <rect x="384" y="95" width="244" height="36" rx="18" fill="var(--orange-soft)"/>
      <text x="506" y="119" text-anchor="middle" fill="var(--orange-deep)" font-size="15" font-weight="700" letter-spacing="2">OPEN-SOURCE CAREER KIT</text>
    </g>

    <g class="wordmark">
      <text x="382" y="216" fill="var(--ink)" font-size="78" font-weight="800" letter-spacing="-3">橙子简历</text>
      <text x="774" y="213" fill="var(--orange-deep)" font-size="36" font-weight="700">Career Skills</text>
    </g>

    <text class="subtitle" x="384" y="276" fill="var(--ink)" font-size="28" font-weight="600">不只改简历，陪你把找工作这件事做对。</text>

    <g class="meta" fill="var(--muted)" font-size="18" font-weight="600" letter-spacing="0.5">
      <text x="384" y="338">11 个求职 Skills</text>
      <circle cx="565" cy="332" r="3.5" fill="var(--orange)"/>
      <text x="586" y="338">从建档到面试复盘</text>
      <circle cx="786" cy="332" r="3.5" fill="var(--leaf)"/>
      <text x="807" y="338">免费开源 · MIT</text>
    </g>
  </g>

  <path class="rule" d="M384 360C548 352 731 369 914 356" fill="none" stroke="var(--orange)" stroke-width="5" stroke-linecap="round"/>
</svg>
